<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Thai OCR</title>
  <style>
    :root { color-scheme: dark; font-family: -apple-system, system-ui, sans-serif; }
    body { margin: 0; background: #000; color: #fff; }
    #stage { position: fixed; inset: 0; }
    video { width: 100%; height: 100%; object-fit: cover; display: block; }
    #guide {
      position: absolute; left: 20px; right: 20px; top: calc(32% - 36px); height: 72px;
      border: 3px solid #ffd60a; border-radius: 8px; box-sizing: border-box;
    }
    #panel {
      position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom));
      display: grid; gap: 8px; max-height: 58vh; overflow: auto; padding: 14px;
      background: rgba(28, 28, 30, 0.88); backdrop-filter: blur(12px); border-radius: 16px;
    }
    #stable { font-size: 1.5rem; min-height: 1.4em; user-select: text; -webkit-user-select: text; }
    #stable:empty::before { content: "Fit one printed line inside the yellow box"; color: #8e8e93; }
    .small { font-size: 0.8rem; color: #aeaeb2; font-variant-numeric: tabular-nums; }
    #crop { height: 36px; max-width: 100%; justify-self: start; }
    #error { color: #ff453a; }
    #error:empty, #crop:not([width]) { display: none; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    button, select { font: inherit; padding: 8px 14px; border: 0; border-radius: 10px; background: #0a84ff; color: #fff; }
    button:disabled { opacity: 0.4; }
    select { background: #3a3a3c; }
    ul { margin: 4px 0 0; padding-left: 1.2em; }
  </style>
</head>
<body>
  <div id="stage">
    <video id="video" playsinline muted></video>
    <div id="guide"></div>
  </div>
  <div id="panel">
    <div id="error"></div>
    <div id="stable"></div>
    <canvas id="crop"></canvas>
    <div id="last" class="small"></div>
    <div id="timing" class="small"></div>
    <div class="row">
      <button id="start" disabled>Start camera</button>
      <button id="freeze" disabled>Freeze</button>
      <button id="copy" disabled>Copy</button>
      <label class="small">OCR
        <select id="rate">
          <option value="500">2/s</option>
          <option value="200">5/s</option>
          <option value="0">Max</option>
        </select>
      </label>
    </div>
    <details id="checks" open>
      <summary class="small" id="summary">Checking this browser…</summary>
      <ul id="checklist" class="small"></ul>
    </details>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
