# XcodeGen spec: `xcodegen generate` writes RealtimeOCR.xcodeproj.
name: RealtimeOCR
options:
  deploymentTarget:
    iOS: "17.0"
packages:
  OCRCore:
    path: OCRCore
targets:
  RealtimeOCR:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: OCRCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.realtimeocr.prototype.k7q2
        DEVELOPMENT_TEAM: JZ72NG6VR2 # Personal Team; change to build under another account
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Thai OCR
        INFOPLIST_KEY_NSCameraUsageDescription: Reads printed text in the camera view. Frames are processed on this iPhone and never leave it.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
schemes:
  RealtimeOCR:
    build:
      targets:
        RealtimeOCR: all
